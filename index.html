<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#FAF9F7">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>CS Partnership</title>

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>">

  <!-- Fonts -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <h1 class="hero-title" id="hero-title">
        <span class="title-line title-line-1" id="title-main">컴퓨터소프트웨어공학과</span>
        <span class="title-line title-line-2">파트너십</span>
      </h1>
      <p class="hero-subtitle">Computer Software Engineering</p>
      <p class="hero-tagline">Exclusive benefits for CS students</p>
    </div>
  </section>

  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-badge" id="store-count">0</span>
        <span class="brand-text">Partner Stores</span>
      </div>

      <div class="search-container">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" class="search-input" id="search-input" placeholder="Search stores...">
      </div>
    </div>

    <!-- Category Filter -->
    <nav class="filter-nav" role="navigation" aria-label="Category filter">
      <button class="filter-chip active" data-category="all">All</button>
      <button class="filter-chip" data-category="food">
        <span class="filter-icon">🍽️</span>
        Food
      </button>
      <button class="filter-chip" data-category="bar">
        <span class="filter-icon">🍸</span>
        Bar
      </button>
      <button class="filter-chip" data-category="cafe">
        <span class="filter-icon">☕</span>
        Cafe
      </button>
      <button class="filter-chip" data-category="convenience">
        <span class="filter-icon">🛒</span>
        Store
      </button>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="main">
    <div class="card-grid" id="card-grid">
      <!-- Flip cards will be rendered here by JS -->
    </div>

    <!-- Empty State -->
    <div class="empty-state hidden" id="empty-state">
      <div class="empty-icon">🔍</div>
      <p class="empty-text">No stores found</p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <p class="footer-main">2026 학생회 청:靑</p>
    <p class="footer-credit">Made by 정익상</p>
  </footer>

  <!-- Scripts -->
  <script src="js/app.js"></script>
</body>
</html>
